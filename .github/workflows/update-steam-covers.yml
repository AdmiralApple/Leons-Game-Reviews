name: Update Steam covers

on:
  push:
    branches:
      - main
    paths:
      - library.json
      - scripts/update-steam-covers.js
      - .github/workflows/update-steam-covers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam-covers
  cancel-in-progress: true

jobs:
  update-steam-covers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Steam cover manifest
        run: node scripts/update-steam-covers.js

      - name: Commit updated manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Steam cover manifest
          file_pattern: steam-covers.json
